<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Education Tracker{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    {% include "navbar.html" %}

    <!-- Main content area: offset by sidebar width on large screens -->
    <div class="lg:ml-60 min-h-screen flex flex-col">
        <main class="flex-1 max-w-7xl w-full mx-auto py-6 px-4 sm:px-6 lg:px-8">
            {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                <div class="p-4 rounded-md text-sm
                    {% if message.tags == 'success' %}bg-green-100 text-green-800 border border-green-200
                    {% elif message.tags == 'error' %}bg-red-100 text-red-800 border border-red-200
                    {% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-800 border border-yellow-200
                    {% else %}bg-blue-100 text-blue-800 border border-blue-200{% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            {% block content %}{% endblock %}
        </main>

        <footer class="bg-white border-t border-gray-200 mt-auto">
            <div class="max-w-7xl mx-auto py-4 px-4 text-center text-sm text-gray-500">
                Education Tracker
            </div>
        </footer>
    </div>

    {% block extra_js %}{% endblock %}
</body>
</html>
